// The NSH runtime is supplied by the host, unmodified: place the released
// Native Shell 0.7.0 `nsh.aar` at android/libs/nsh.aar, or pass
// -PnshAar=/absolute/path/to/nsh.aar. It is never committed (see .gitignore).
//
// `compileOnly` keeps the runtime out of this library's own AAR: the host app
// adds exactly one copy. The instrumentation tests add it at runtime, because
// they run the real SDK classes and libnsh.so.
plugins {
    id 'com.android.library'
}

version = '0.7.0'

def nshAar = file(findProperty('nshAar') ?: "${rootDir}/libs/nsh.aar")
if (!nshAar.isFile()) {
    throw new GradleException(
        "nsh-ext: the unmodified Native Shell 0.7.0 Android library is missing at ${nshAar}. " +
        "Use nsh.aar from the v0.7.0 release asset nsh-embed-android.zip " +
        "(nsh-embed-android/nsh.aar), put it there, or pass -PnshAar=/absolute/path/to/nsh.aar.")
}

android {
    namespace 'com.honsunrise.nshext'
    compileSdk 35

    defaultConfig {
        minSdk 26
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly files(nshAar)
    androidTestImplementation files(nshAar)
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
