// The Android companion of the `nsh-ext` crate: one library module the host app
// includes, and an example app that registers it on its own NshView.
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = 'nsh-ext-android'
include ':webview'
include ':example'
