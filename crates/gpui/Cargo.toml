# The GPUI adapter is a workspace of its own: GPUI and its native dependencies
# (WKWebView, WebView2, WebKitGTK 4.1 on GTK 3) stay out of every other
# adapter's lock graph. The Linux graph here has GTK 3 only; an adapter that
# needs GTK 4 has its own.
[package]
name = "nsh-ext-gpui"
version = "0.6.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
description = "nsh-ext WebView for Native Shell's GPUI backend: an owned wry web view as a native component."
repository = "https://github.com/honsunrise/nsh-ext"
readme = "README.md"
include = ["src/**", "examples/**", "README.md", "LICENSE-APACHE", "Cargo.toml"]

[workspace]
resolver = "3"

[features]
default = []
runtime-shaders = ["nsh-platform-gpui/runtime-shaders"]

[dependencies]
nsh-ext = { version = "0.6.0", path = "../.." }
nsh-core = { version = "=0.6.0", default-features = false }
# The GPUI backend of Native Shell, whose public `NativeComponent` contract this
# adapter implements. `webview` stays off: this crate owns its own wry web view
# and never replaces the backend's. `js` too: the examples run Rust roots, and
# the adapter itself never runs an app's code.
nsh-platform-gpui = { version = "=0.6.0", default-features = false }
log = "0.4"
# `lb-wry`: the crate published under wry's name API, the version the GPUI
# backend uses (and the one GPUI Kit's `gpui-webview` uses).
wry = { package = "lb-wry", version = "=0.53.3", default-features = false, features = [
    "os-webview",
    "x11",
] }

[target.'cfg(any(target_os = "linux", target_os = "macos", windows))'.dependencies]
# NSH 0.6.0 builds with this GPUI Fast family, so the pins match the backend's
# exactly: an application must resolve one GPUI, and lockfiles alone cannot
# constrain resolution in applications consuming this library.
gpui-fast = { version = "=0.1.16", default-features = false }
gpui-fast-platform = { version = "=0.1.16", default-features = false }
gpui-fast-macros = "=0.1.16"

[target.'cfg(target_os = "linux")'.dependencies]
anyhow = "1"
gtk = "0.18"
webkit2gtk = { version = "=2.0.1", features = ["v2_38"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSObject",
    "NSString",
    "NSDictionary",
    "NSKeyValueObserving",
    "NSError",
    "NSURLError",
] }
# WebKit's navigation delegate: the extension's proxy implements it, and the
# types of the callbacks it adds and forwards come from here.
objc2-web-kit = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-app-kit",
    "block2",
    "WKWebView",
    "WKNavigation",
    "WKNavigationDelegate",
    "WKNavigationAction",
    "WKNavigationResponse",
    "WKDownload",
    "WebKitErrors",
] }
block2 = "0.6"

[target.'cfg(windows)'.dependencies]
# `BOOL`, as WebView2's `IsSuccess` and `IsRedirected` take it.
windows-core = "0.61"
webview2-com = "0.38"

[dev-dependencies]
env_logger = "0.11"

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"
