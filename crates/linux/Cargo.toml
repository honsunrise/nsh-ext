[package]
name = "nsh-ext-linux"
version = "0.6.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
description = "Linux (GTK 4, WebKitGTK 6.0) adapter for nsh-ext's extension-owned WebView"
repository = "https://github.com/honsunrise/nsh-ext"
readme = "README.md"
keywords = ["nsh", "webview", "gtk", "webkitgtk"]
categories = ["gui"]
include = ["src/**", "examples/**", "README.md", "LICENSE-APACHE", "Cargo.toml"]

# A package of its own: the adapter's lock graph is independent of the root
# package's, so Linux's GTK 4 / WebKitGTK 6.0 stack is never mixed into a
# macOS or Windows build.
[workspace]

[dependencies]
nsh-ext = { version = "0.6.0", path = "../.." }
nsh-core = { version = "=0.6.0", default-features = false }
nsh-platform-linux = { version = "=0.6.0", default-features = false }
webkit6 = "0.6"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
